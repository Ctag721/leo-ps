name: PS5 Pro stock watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟（GitHub 高峰期可能会延迟）
  workflow_dispatch:         # 允许在 Actions 页面手动运行，会发一条测试推送

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      # 取回上一次检查的结果，用来判断页面有没有变化
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
